name: QCMS Android Test APK

# QCMS v4.14.49: authoritative Android compilation runs for EVERY main-branch QCMS release push and verifies the single native V1.2-style drawer source.

# Builds only the mobile source. Does not deploy QCMS, access Supabase, or send emails.
# Artifact/version values are read from app/build.gradle so future Android version bumps cannot leave stale CI checks behind.
on:
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Optional reason / release reference'
        required: false
        default: 'manual QCMS Android build'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qcms-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.9'
      - name: Reuse test signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qcms-android-test-key-${{ github.repository_id }}-v1
      - name: Install Android API 35 tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          [ -x "$MANAGER" ] || { echo 'Android SDK manager is missing from the build runner.'; exit 1; }
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
          RC=${PIPESTATUS[1]}
          set -o pipefail
          [ "$RC" -eq 0 ] || exit "$RC"
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          printf 'sdk.dir=%s\n' "$SDK" > mobile/android_qcms/local.properties
          printf 'QCMS_ANDROID_SDK=%s\n' "$SDK" >> "$GITHUB_ENV"
      - name: Read Android build identity
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE=mobile/android_qcms/app/build.gradle
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" "$GRADLE_FILE" | head -1)"
          VERSION_CODE="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" "$GRADLE_FILE" | head -1)"
          [ -n "$VERSION_NAME" ] || { echo 'Unable to read versionName from app/build.gradle'; exit 1; }
          [ -n "$VERSION_CODE" ] || { echo 'Unable to read versionCode from app/build.gradle'; exit 1; }
          printf 'QCMS_MOBILE_VERSION=%s\n' "$VERSION_NAME" >> "$GITHUB_ENV"
          printf 'QCMS_MOBILE_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          QCMS_RELEASE="$(tr -d '\r\n' < VERSION)"
          printf 'QCMS_APK_NAME=QCMS_Mobile_v%s_TEST.apk\n' "$VERSION_NAME" >> "$GITHUB_ENV"
          printf 'QCMS_SERVER_RELEASE=%s\n' "$QCMS_RELEASE" >> "$GITHUB_ENV"
          echo "QCMS release=$QCMS_RELEASE Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"
      - name: Verify classic WebView navigation source before compile (Verify native navigation source before compile fallback)
        shell: bash
        run: |
          set -euo pipefail
          SRC=mobile/android_qcms/app/src/main/java/com/fourstar/qcms/MainActivity.java
          if grep -Fq 'QCMSClassicShell/1.0.2' "$SRC"; then
            grep -Fq 'return false;' "$SRC"
            if grep -Eq '__qcmsNativeNavigate|QCMS_NAV_PENDING' "$SRC"; then echo 'Competing native navigation detected'; exit 1; fi
            exit 0
          fi
          grep -Fq 'setText("MENU")' "$SRC"
          grep -Fq 'hamburger.setOnClickListener(v -> openDrawer())' "$SRC"
          grep -Fq 'drawerLayer.setVisibility(View.VISIBLE)' "$SRC"
          grep -Fq 'drawerSection("▦", "Masters"' "$SRC"
          grep -Fq 'drawerSection("▣", "Supply Chain"' "$SRC"
          grep -Fq 'appendQueryParameter("native_nav", "native")' "$SRC"
          if grep -Fq 'showStableStreamlitBrowser' "$SRC"; then echo 'Legacy dual-navigation code detected'; exit 1; fi
          if grep -Fq 'toggleStreamlitSidebar' "$SRC"; then echo 'Legacy DOM/sidebar navigation code detected'; exit 1; fi
          test -f mobile/android_qcms/app/src/main/res/drawable/ic_qcms_menu.xml
      - name: Compile APK and run Android lint
        working-directory: mobile/android_qcms
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify signature, alignment and APK contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-artifacts
          APK="apk-artifacts/$QCMS_APK_NAME"
          cp mobile/android_qcms/app/build/outputs/apk/debug/app-debug.apk "$APK"
          BT="$QCMS_ANDROID_SDK/build-tools/35.0.0"

          # apksigner success is the authoritative signature result. With QCMS minSdk 26,
          # Signature Scheme v2 is valid. Optional v1/v3/v3.1/v4/SourceStamp 'false'
          # lines are informational and must never fail the workflow by themselves.
          set +e
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-artifacts/SIGNATURE_VERIFICATION.txt
          APKSIGN_RC=${PIPESTATUS[0]}
          set -e
          [ "$APKSIGN_RC" -eq 0 ] || { echo "apksigner verification failed with exit code $APKSIGN_RC"; exit "$APKSIGN_RC"; }
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apk-artifacts/SIGNATURE_VERIFICATION.txt || {
            echo 'Required APK Signature Scheme v2 verification was not true.'
            exit 1
          }

          "$BT/zipalign" -c -P 16 -v 4 "$APK" > apk-artifacts/ALIGNMENT_VERIFICATION.txt
          "$BT/aapt" dump badging "$APK" | tee apk-artifacts/APK_PACKAGE_INFO.txt

          ACTUAL_PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" apk-artifacts/APK_PACKAGE_INFO.txt | head -1)"
          ACTUAL_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" apk-artifacts/APK_PACKAGE_INFO.txt | head -1)"
          ACTUAL_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" apk-artifacts/APK_PACKAGE_INFO.txt | head -1)"
          [ "$ACTUAL_PACKAGE" = "com.fourstar.qcms.test" ] || { echo "Unexpected package: $ACTUAL_PACKAGE"; exit 1; }
          [ "$ACTUAL_VERSION" = "$QCMS_MOBILE_VERSION" ] || { echo "VersionName mismatch: APK=$ACTUAL_VERSION Gradle=$QCMS_MOBILE_VERSION"; exit 1; }
          [ "$ACTUAL_CODE" = "$QCMS_MOBILE_VERSION_CODE" ] || { echo "VersionCode mismatch: APK=$ACTUAL_CODE Gradle=$QCMS_MOBILE_VERSION_CODE"; exit 1; }

          (cd apk-artifacts && sha256sum "$QCMS_APK_NAME" > SHA256SUMS.txt)
          cp mobile/android_qcms/INSTALL_APK_ON_SAMSUNG.md apk-artifacts/INSTALL_README.md
          printf 'Signature status: PASS. APK Signature Scheme v2 verified true. Optional v1/v3/v3.1/v4/SourceStamp values may be false for this internal debug APK and are not CI failures.\n' > apk-artifacts/VERIFICATION_SUMMARY.txt
          printf '## QCMS APK built and verified\nQCMS release **%s** / Android **%s** passed compile, lint, apksigner v2 verification, zipalign and package/version checks. Download **QCMS-Mobile-TEST-APK** below and install `%s`.\n' "$QCMS_SERVER_RELEASE" "$QCMS_MOBILE_VERSION" "$QCMS_APK_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Downloadable APK package
        uses: actions/upload-artifact@v4
        with:
          name: QCMS-Mobile-TEST-APK
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 30

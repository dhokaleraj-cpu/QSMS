name: STAWN QCMS iOS iPadOS App Build

on:
  push:
    paths:
      - "mobile/ios_stawn_qcms/**"
      - ".github/workflows/stawn-qcms-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          # R41: newest Xcode on the runner (Xcode 16.x on macos-15), same generation as the Mac that archives for TestFlight
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer" || true
          xcodebuild -version
      - name: Generate project
        working-directory: mobile/ios_stawn_qcms
        run: python3 make_project.py 1.4.0 ${{ github.run_number }}
      - name: Build for iOS Simulator (compile check, no signing)
        working-directory: mobile/ios_stawn_qcms
        run: |
          set -o pipefail
          xcodebuild -project STAWNQCMS.xcodeproj -scheme STAWNQCMS -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -80 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build for iOS device (Release, compile check, no signing)
        working-directory: mobile/ios_stawn_qcms
        run: |
          xcodebuild -project STAWNQCMS.xcodeproj -scheme STAWNQCMS -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build-device.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-device.log | head -80 || true
          cat build-device.log >> build.log
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAWN-QCMS-iOS-build-log
          path: mobile/ios_stawn_qcms/build.log
